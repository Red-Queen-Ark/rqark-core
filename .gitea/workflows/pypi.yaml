name: Build and Publish with uv

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v3
      with:
        enable-cache: true

    - name: Set up Python
      run: uv python install 3.14

    - name: Build the package
      run: uv build

    - name: Publish to Gitea PyPI
      env:
        UV_PUBLISH_URL: ${{ github.server_url }}/api/packages/${{ github.repository_owner }}/pypi
        UV_PUBLISH_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
        UV_PUBLISH_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
      run: uv publish
