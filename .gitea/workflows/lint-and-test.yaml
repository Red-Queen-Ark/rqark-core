name: Lint and Test

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, type check and test
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v3
      with:
        enable-cache: true

    - name: Set up Python
      run: uv python install 3.14

    - name: Sync dependencies
      run: uv sync

    - name: Lint
      run: uv run ruff check

    - name: Format check
      run: uv run ruff format --check

    - name: Type check
      run: uv run ty check

    - name: Test
      run: uv run pytest
