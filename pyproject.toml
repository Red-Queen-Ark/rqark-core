[project]
name = "rqark-core"
version = "0.1.1"
description = "Red Queen Ark Core Agent Library"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "openai>=2.37.0",
    "ddgs>=0.5.3"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rqark_core"]
